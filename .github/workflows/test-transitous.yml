name: Test Transitous route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-transitous.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query Verona Milan public transport
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          H={"User-Agent":"RouteSaver/0.1 (https://baiez82-stack.github.io/routesaver/)","Accept":"application/json"}
          def get(url):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=90) as r: return json.load(r)
          for txt in ("Verona Porta Nuova","Milano Centrale"):
              u="https://api.transitous.org/api/v1/geocode?"+urllib.parse.urlencode({"text":txt,"language":"it","type":"STOP","numResults":5})
              j=get(u)
              print("GEO "+txt+"="+json.dumps(j,ensure_ascii=False)[:7000])
          params={
            "fromPlace":"45.4384,10.9916",
            "toPlace":"45.4642,9.1900",
            "time":"2026-09-29T08:00:00+02:00",
            "radius":"3500",
            "transitModes":"TRANSIT",
            "directModes":"",
            "maxTransfers":"4",
            "detailedLegs":"false",
            "detailedTransfers":"false",
          }
          u="https://api.transitous.org/api/v6/plan?"+urllib.parse.urlencode(params)
          data=get(u)
          print("COORD_ITINERARIES="+str(len(data.get("itineraries",[]))))
          print("COORD_SAMPLE="+json.dumps((data.get("itineraries") or [{}])[0],ensure_ascii=False)[:18000])
          PY

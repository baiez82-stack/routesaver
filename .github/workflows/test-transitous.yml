name: Test Transitous route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-transitous.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify browser CORS and sample route
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          params={
            "fromPlace":"45.4384,10.9916","toPlace":"45.4642,9.1900",
            "time":"2026-09-29T08:00:00+02:00","radius":"3500",
            "transitModes":"TRANSIT","directModes":"","maxTransfers":"4",
            "detailedLegs":"false","detailedTransfers":"false","withFares":"true","passengers":"2","language":"it"
          }
          u="https://api.transitous.org/api/v6/plan?"+urllib.parse.urlencode(params)
          req=urllib.request.Request(u,headers={
            "User-Agent":"RouteSaver/0.1 (https://baiez82-stack.github.io/routesaver/)",
            "Accept":"application/json",
            "Origin":"https://baiez82-stack.github.io"
          })
          with urllib.request.urlopen(req,timeout=90) as r:
            data=json.load(r)
            print("ACAO="+str(r.headers.get("Access-Control-Allow-Origin")))
          print("COUNT="+str(len(data.get("itineraries",[]))))
          PY

name: Update MIMIT fuel stations

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_fuel_stations.py"
      - ".github/workflows/update-fuel-stations.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update MIMIT fuel stations
        run: python scripts/update_fuel_stations.py
      - name: Commit updated station data
        run: |
          if [ -z "$(git status --porcelain -- data/fuel-stations.json)" ]; then
            echo "No fuel station changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-stations.json
          git commit -m "Update MIMIT fuel stations"
          git push

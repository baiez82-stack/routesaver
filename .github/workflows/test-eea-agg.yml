name: Test EEA aggregate API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-eea-agg.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test composite aggregation
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q={
            "size":0,
            "query":{"bool":{"must":[{"term":{"year":2025}}]}},
            "aggs":{"vehicles":{"composite":{"size":5,"sources":[
              {"make":{"terms":{"field":"Mk"}}},
              {"model":{"terms":{"field":"Cn"}}},
              {"fuel":{"terms":{"field":"Ft"}}},
              {"mode":{"terms":{"field":"Fm"}}}
            ]},
            "aggs":{
              "avg_fc":{"avg":{"field":"Fc"}},
              "avg_wh":{"avg":{"field":"z__Wh_km_"}},
              "avg_range":{"avg":{"field":"Zr"}},
              "avg_kw":{"avg":{"field":"ep__KW_"}},
              "regs":{"sum":{"field":"r"}}
            }}}
          }
          u="https://co2cars.apps.eea.europa.eu/tools/api?source="+urllib.parse.quote(json.dumps(q,separators=(",",":")))
          req=urllib.request.Request(u,headers={"User-Agent":"RouteSaver/1.3","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
            data=json.load(r)
          print(json.dumps(data,ensure_ascii=False)[:12000])
          PY

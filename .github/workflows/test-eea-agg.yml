name: Test EEA aggregate API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-eea-agg.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test nested terms aggregation
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q={
            "size":0,
            "query":{"bool":{"must":[{"term":{"year":2025}},{"term":{"Mk":"HYUNDAI"}}]}},
            "aggs":{"models":{"terms":{"field":"Cn","size":100},
              "aggs":{"fuels":{"terms":{"field":"Ft","size":10},
                "aggs":{"modes":{"terms":{"field":"Fm","size":10},
                  "aggs":{
                    "avg_wh":{"avg":{"field":"z__Wh_km_"}},
                    "avg_range":{"avg":{"field":"Zr"}},
                    "avg_kw":{"avg":{"field":"ep__KW_"}},
                    "regs":{"sum":{"field":"r"}}
                  }
                }}
              }}
            }}
          }
          u="https://co2cars.apps.eea.europa.eu/tools/api?source="+urllib.parse.quote(json.dumps(q,separators=(",",":")))
          req=urllib.request.Request(u,headers={"User-Agent":"RouteSaver/1.5","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
            data=json.load(r)
          print(json.dumps(data,ensure_ascii=False)[:20000])
          PY

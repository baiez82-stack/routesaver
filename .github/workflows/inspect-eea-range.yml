name: Inspect EEA electric range fields

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eea-range.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EV and PHEV rows
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          queries=[
            "SELECT TOP 1 * FROM [CO2Emission].[latest].[co2cars_2025Pv31] WHERE [Mk]='TESLA' AND [Cn]='MODEL Y' AND [Z (Wh/km)] IS NOT NULL",
            "SELECT TOP 1 * FROM [CO2Emission].[latest].[co2cars_2025Pv31] WHERE [Mk]='HYUNDAI' AND [Cn] LIKE '%TUCSON%' AND [Fm]='P' AND [Z (Wh/km)] IS NOT NULL"
          ]
          for q in queries:
            url="https://discodata.eea.europa.eu/sql?"+urllib.parse.urlencode({"query":q,"p":1,"nrOfHits":5})
            req=urllib.request.Request(url,headers={"User-Agent":"RouteSaver/0.8"})
            with urllib.request.urlopen(req,timeout=60) as r:
              data=json.load(r)
            print("ROW="+json.dumps((data.get("results") or [{}])[0],ensure_ascii=False))
          PY

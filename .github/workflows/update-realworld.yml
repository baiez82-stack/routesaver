name: Update EEA real-world calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/update_realworld.py"
      - ".github/workflows/update-realworld.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update EEA real-world calibration
        run: python scripts/update_realworld.py
      - name: Commit updated calibration
        run: |
          if [ -z "$(git status --porcelain -- data/realworld.json)" ]; then
            echo "No real-world calibration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realworld.json
          git commit -m "Update EEA real-world calibration"
          git push

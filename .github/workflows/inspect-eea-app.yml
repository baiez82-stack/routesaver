name: Inspect EEA app API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eea-app.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EEA viewer request format
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          base="https://co2cars.apps.eea.europa.eu/"
          files=[
            "esbootstrap_resources/min/bundle/07a79bb_index_page.js",
            "external_templates_scripts.js"
          ]
          for rel in files:
            u=urllib.parse.urljoin(base,rel)
            req=urllib.request.Request(u,headers={"User-Agent":"RouteSaver/1.1"})
            with urllib.request.urlopen(req,timeout=60) as r:
              js=r.read().decode("utf-8","replace")
            print("FILE",rel)
            for pat in ("tools/api","esbootstrap_options","search_index","search_url","source:",'"source"',"query_string","facets","Zr"):
              for m in list(re.finditer(re.escape(pat),js,re.I))[:12]:
                print("MATCH",pat,js[max(0,m.start()-700):m.end()+1200].replace("\n"," "))
          PY

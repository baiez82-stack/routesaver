name: Inspect EEA app API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eea-app.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EEA viewer source
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          u="https://co2cars.apps.eea.europa.eu/"
          req=urllib.request.Request(u,headers={"User-Agent":"RouteSaver/0.9"})
          with urllib.request.urlopen(req,timeout=60) as r:
              html=r.read().decode("utf-8","replace")
          print("HTML_LEN="+str(len(html)))
          for pat in ("elasticsearch","_search","api/","download","csv","bundle","script src"):
              hits=[]
              for m in re.finditer(pat,html,re.I):
                  hits.append(html[max(0,m.start()-120):m.end()+180].replace("\n"," "))
              print("PATTERN",pat,"HITS",len(hits))
              for h in hits[:20]: print(h)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print("SCRIPTS="+repr(scripts[:30]))
          PY

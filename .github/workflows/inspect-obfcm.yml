name: Inspect EEA real-world data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-obfcm.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Tucson real-world entries
        run: |
          python - <<'PY'
          import json
          with open("data/vehicles.json", encoding="utf-8") as f:
              data=json.load(f)
          print("META="+repr({k:data.get(k) for k in ("year","real_world_reporting_year","note")}))
          rows=[v for v in data.get("vehicles",[]) if "HYUNDAI" in v.get("make","") and "TUCSON" in v.get("model","")]
          print("COUNT="+str(len(rows)))
          for v in rows[:20]:
              print("TUCSON="+repr(v))
          PY

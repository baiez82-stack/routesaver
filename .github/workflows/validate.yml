name: Validate RouteSaver

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "plus.html"
      - "billing/**"
      - "tests/**"
      - "assets/merchant.mjs"
      - "privacy.html"
      - "terms.html"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and JSON
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/routesaver-app.js").write_text("\n".join(scripts), encoding="utf-8")
          for path in ("data/fuel.json", "data/vehicles.json"):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
          print("Static files and JSON are valid")
          PY
          node --check /tmp/routesaver-app.js

      - name: Validate billing preparation
        run: node --test tests/billing.test.mjs

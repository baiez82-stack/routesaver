name: Test Valhalla road classes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-roadmix.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query route and road classes
        run: |
          python - <<'PY'
          import json, urllib.request
          base="https://valhalla1.openstreetmap.de"
          route_payload={
            "locations":[{"lat":45.4384,"lon":10.9916},{"lat":45.4642,"lon":9.1900}],
            "costing":"auto",
            "shape_format":"geojson",
            "format":"osrm"
          }
          req=urllib.request.Request(base+"/route",data=json.dumps(route_payload).encode(),headers={"Content-Type":"application/json","User-Agent":"RouteSaver/0.3"})
          with urllib.request.urlopen(req,timeout=60) as r:
            route=json.load(r)
          coords=route["routes"][0]["geometry"]["coordinates"]
          # downsample if needed while keeping endpoints
          if len(coords)>800:
            step=max(1,len(coords)//800)
            coords=coords[::step]
            if coords[-1] != route["routes"][0]["geometry"]["coordinates"][-1]:
              coords.append(route["routes"][0]["geometry"]["coordinates"][-1])
          trace_payload={
            "shape":[{"lat":p[1],"lon":p[0]} for p in coords],
            "costing":"auto",
            "shape_match":"map_snap",
            "filters":{"action":"include","attributes":["edge.length","edge.road_class","edge.use","edge.speed"]}
          }
          req=urllib.request.Request(base+"/trace_attributes",data=json.dumps(trace_payload).encode(),headers={"Content-Type":"application/json","User-Agent":"RouteSaver/0.3"})
          with urllib.request.urlopen(req,timeout=60) as r:
            data=json.load(r)
          print("TRACE_KEYS="+json.dumps(list(data.keys())))
          print("EDGE_COUNT="+str(len(data.get("edges",[]))))
          print("EDGE_SAMPLE="+json.dumps(data.get("edges",[])[:8],ensure_ascii=False))
          PY

name: Inspect EEA vehicle schema

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eea.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test grouped EEA vehicle query
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q = """SELECT TOP 25 [Mk] AS make, [Cn] AS model, [Ft] AS fuel,
          ROUND(AVG(CASE WHEN [Fc] > 0 AND [Fc] < 30 THEN CAST([Fc] AS float) END), 2) AS fc,
          ROUND(AVG(CASE WHEN [Z (Wh/km)] > 0 AND [Z (Wh/km)] < 1000 THEN CAST([Z (Wh/km)] AS float) END), 0) AS whkm,
          ROUND(AVG(CASE WHEN [Ep (KW)] > 0 AND [Ep (KW)] < 1500 THEN CAST([Ep (KW)] AS float) END), 0) AS kw,
          SUM(CASE WHEN [R] > 0 THEN [R] ELSE 1 END) AS registrations
          FROM [CO2Emission].[latest].[co2cars_2025Pv31]
          WHERE [Mk] IS NOT NULL AND [Cn] IS NOT NULL
          GROUP BY [Mk], [Cn], [Ft]
          ORDER BY registrations DESC"""
          url = "https://discodata.eea.europa.eu/sql?" + urllib.parse.urlencode({"query": q, "p": 1, "nrOfHits": 100})
          req = urllib.request.Request(url, headers={"User-Agent":"RouteSaver/0.1"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          print("EEA_GROUPED=" + json.dumps(data, ensure_ascii=False))
          PY

name: Inspect EEA vehicle schema

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-eea.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official EEA CO2 cars schema
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q = "SELECT TOP 1 * FROM [CO2Emission].[latest].[co2cars_2025Pv31]"
          url = "https://discodata.eea.europa.eu/sql?" + urllib.parse.urlencode({"query": q, "p": 1, "nrOfHits": 1})
          req = urllib.request.Request(url, headers={"User-Agent":"RouteSaver/0.1"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          print("EEA_KEYS=" + json.dumps(list(data["results"][0].keys()), ensure_ascii=False))
          print("EEA_SAMPLE=" + json.dumps(data["results"][0], ensure_ascii=False))
          PY

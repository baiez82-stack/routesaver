name: RouteSaver smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site
        run: |
          curl -fsSL --retry 5 --retry-delay 3 https://baiez82-stack.github.io/routesaver/ -o /tmp/routesaver.html
          grep -q 'fromSuggestions' /tmp/routesaver.html
          grep -q 'data-v="plugin"' /tmp/routesaver.html
          echo "Live page contains autocomplete and plug-in hybrid UI"

      - name: Probe Photon variants
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          urls=[
            'https://photon.komoot.io/api?q=Verona&limit=5&lang=it',
            'https://photon.komoot.io/api?q=Via%20Roma%20Verona&limit=5&lang=it',
            'https://photon.komoot.io/api?q=Via%20Roma%2012%2C%20Verona&limit=5',
          ]
          for u in urls:
              print('\nURL',u)
              for origin in (None,'https://baiez82-stack.github.io'):
                  headers={'User-Agent':'RouteSaver-Smoke-Test/1.0','Accept':'application/json'}
                  if origin: headers['Origin']=origin
                  req=urllib.request.Request(u,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          data=json.load(r)
                          print(' origin=',origin,'status=',r.status,'acao=',r.headers.get('Access-Control-Allow-Origin'),'features=',len(data.get('features',[])))
                  except urllib.error.HTTPError as e:
                      print(' origin=',origin,'HTTP',e.code,'body=',e.read(250))
          PY

      - name: Check responsive viewport
        run: |
          grep -q 'width=device-width' /tmp/routesaver.html
          grep -q '@media(max-width:720px)' /tmp/routesaver.html
          echo "Mobile viewport and responsive breakpoint present"

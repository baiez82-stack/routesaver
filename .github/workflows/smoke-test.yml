name: RouteSaver smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site
        run: |
          curl -fsSL --retry 5 --retry-delay 3 https://baiez82-stack.github.io/routesaver/ -o /tmp/routesaver.html
          grep -q 'fromSuggestions' /tmp/routesaver.html
          grep -q 'data-v="plugin"' /tmp/routesaver.html
          grep -q 'width=device-width' /tmp/routesaver.html
          grep -q '@media(max-width:720px)' /tmp/routesaver.html
          echo "Live page contains autocomplete, plug-in hybrid and mobile responsive rules"

      - name: Check Photon autocomplete API and CORS
        run: |
          python - <<'PY'
          import urllib.request, json
          u='https://photon.komoot.io/api?q=Via%20Roma%2012%2C%20Verona&limit=5'
          req=urllib.request.Request(u,headers={
              'Origin':'https://baiez82-stack.github.io',
              'User-Agent':'RouteSaver-Smoke-Test/1.0',
              'Accept':'application/json'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
              acao=r.headers.get('Access-Control-Allow-Origin')
              features=len(data.get('features',[]))
              print('status:',r.status)
              print('access-control-allow-origin:',acao)
              print('features:',features)
              if r.status != 200:
                  raise SystemExit('Photon HTTP status is not 200')
              if acao not in ('*','https://baiez82-stack.github.io'):
                  raise SystemExit('Photon CORS is not enabled for the live site')
              if features < 1:
                  raise SystemExit('Photon returned no suggestions')
          PY

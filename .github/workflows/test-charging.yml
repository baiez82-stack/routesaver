name: Test charging station query

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-charging.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query charging stations near sample route
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q='[out:json][timeout:25];nwr["amenity"="charging_station"](around:5000,45.4384,10.9916,45.4642,9.1900);out center tags;'
          data=urllib.parse.urlencode({"data":q}).encode()
          req=urllib.request.Request("https://overpass-api.de/api/interpreter",data=data,headers={"User-Agent":"RouteSaver/0.5"})
          with urllib.request.urlopen(req,timeout=60) as r:
              j=json.load(r)
          print("COUNT="+str(len(j.get("elements",[]))))
          print("SAMPLE="+json.dumps(j.get("elements",[])[:3],ensure_ascii=False))
          PY

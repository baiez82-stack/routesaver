name: Test charging station query

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-charging.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query charging stations near one route point
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          q='[out:json][timeout:20];nwr["amenity"="charging_station"]["motorcar"!="no"](around:12000,45.5416,10.2118);out center tags;'
          data=urllib.parse.urlencode({"data":q}).encode()
          last=None
          for endpoint in ("https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"):
              try:
                  req=urllib.request.Request(endpoint,data=data,headers={"User-Agent":"RouteSaver/0.6"})
                  with urllib.request.urlopen(req,timeout=45) as r: j=json.load(r)
                  print("ENDPOINT="+endpoint)
                  print("COUNT="+str(len(j.get("elements",[]))))
                  print("SAMPLE="+json.dumps(j.get("elements",[])[:3],ensure_ascii=False))
                  break
              except Exception as e:
                  last=e
          else:
              raise last
          PY

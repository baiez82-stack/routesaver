name: Update MIMIT fuel prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_fuel.py"
      - ".github/workflows/update-fuel.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update fuel data
        run: python scripts/update_fuel.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/fuel.json; then
            echo "No fuel data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel.json
          git commit -m "Update MIMIT fuel prices"
          git push
